name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexa_test
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nexa:nexa_test_password@localhost:5432/nexa_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_secret_key_not_for_production
      _CLIENT_ID: mock_client_id
      PLUGGY_CLIENT_SECRET: mock_client_secret
      OPENAI_API_KEY: mock_openai_key
      LLM_PROVIDER: openai
      APP_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -x --tb=short -q

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audita exatamente os pins do requirements.txt (sem resolver deps).
      #
      # BASELINE ACEITO — família langchain/langgraph 0.2.x. TODOS têm o mesmo
      # bloqueio: o fix exige langchain/langgraph 1.x, que é reescrita do
      # agente. Racional e mitigação: docs/SEGURANCA.md.
      #
      # Revisado em 2026-08-25. A lista tinha 5 entradas e o `pip-audit`
      # reportava 14 vulnerabilidades — ou seja, o job REPROVAVA, e reprovava
      # desde antes desta rodada: PYSEC-2026-2194 (langgraph), PYSEC-2026-2192
      # e -2555 (langchain) e PYSEC-2026-2556 (langchain-anthropic) já estavam
      # nos pins originais e fora do baseline. `CVE-2026-55443` era ignore
      # obsoleto (não aparece mais) e saiu: ignore que não corresponde a nada
      # mascara o próximo.
      #
      # Qualquer CVE NOVO fora desta lista quebra o build. Ao subir a família
      # para 1.x, esta lista inteira deve ser esvaziada e o job re-rodado.
      - name: Audit pinned dependencies
        working-directory: backend
        run: |
          pip-audit -r requirements.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-83 \
            --ignore-vuln PYSEC-2026-2194 \
            --ignore-vuln PYSEC-2026-1527 \
            --ignore-vuln PYSEC-2026-2573 \
            --ignore-vuln PYSEC-2026-2574 \
            --ignore-vuln PYSEC-2026-3635 \
            --ignore-vuln PYSEC-2026-2192 \
            --ignore-vuln PYSEC-2026-2555 \
            --ignore-vuln PYSEC-2026-2556 \
            --ignore-vuln CVE-2024-8309 \
            --ignore-vuln CVE-2024-7774 \
            --ignore-vuln PYSEC-2026-76

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexa-api ./backend
