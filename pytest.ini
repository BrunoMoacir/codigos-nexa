[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --ignore=backend/tests/architect --ignore=backend/tests/test_e2e_production_ready.py

# Não coleta scripts na raiz (test_auth.py, test_users.py, etc.)
norecursedirs = .git .venv venv frontend node_modules
