# pyproject.toml — fonte de verdade para metadados e dependências do projeto (PEP 621)
#
# Declara dependências DIRETAS com ranges mínimos.
# O arquivo requirements.txt é o lock file de produção (versões exatas).
#
# Instalar:
#   pip install -e .              # produção (sem extras)
#   pip install -e ".[dev]"       # desenvolvimento
#
# Atualizar o lock file (requer pip-tools):
#   pip-compile pyproject.toml -o requirements.txt --strip-extras

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nexa-backend"
version = "0.1.0"
description = "Nexa — Plataforma de Inteligência Financeira Pessoal"
requires-python = ">=3.12"

dependencies = [
    # ── Core ──────────────────────────────────────────────────────────
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "starlette>=0.35.0",

    # ── Validação e configuração ──────────────────────────────────────
    "pydantic>=2.12.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # ── Banco de dados ────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── ETL e processamento de dados ──────────────────────────────────
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",

    # ── AI / LLM ──────────────────────────────────────────────────────
    "langgraph>=0.2.0,<2.0.0",
    "langgraph-checkpoint-redis>=0.0.1",
    "langchain>=0.2.0,<0.4.0",
    "langchain-anthropic>=0.1.0,<0.4.0",
    "langchain-openai>=0.1.0,<0.3.0",

    # ── Machine learning ──────────────────────────────────────────────
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # ── Autenticação ──────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<5.0.0",

    # ── HTTP / networking ─────────────────────────────────────────────
    "httpx>=0.26.0",
    "requests>=2.32.0",

    # ── Cache e rate-limit ────────────────────────────────────────────
    "redis>=5.0.0",
    "slowapi>=0.1.9",

    # ── Scheduler ────────────────────────────────────────────────────
    "apscheduler>=3.10.0",

    # ── Utilitários ───────────────────────────────────────────────────
    "python-dateutil>=2.8.2",
    "SALib>=1.4.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pip-tools>=7.0.0",
]
ml = [
    # Instalar com: pip install -e ".[ml]"
    # Prophet puxa pandas e pystan automaticamente (~2 min de build no primeiro uso)
    "prophet>=1.1.5",
]

# ── Ferramentas ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
