version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/:/app/backend/
    env_file:
      - ./backend/.env
    environment:
      - APP_MODE=prod
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://nexa_user:nexa_password@postgres:5432/nexa_db
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - nexa-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nexa_user
      - POSTGRES_PASSWORD=nexa_secret
      - POSTGRES_DB=nexa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - nexa-network

  # Frontend React
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    networks:
      - nexa-network

networks:
  nexa-network:
    driver: bridge

volumes:
  postgres_data:
